services:
  paper-studio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    volumes:
      - paper-studio-data:/app/data
      - paper-studio-workspace:/app/workspace
      - paper-studio-assets:/app/public/assets
      - paper-studio-voiceover:/app/public/voiceover
    mem_limit: 8g
    memswap_limit: 12g
    cpus: 4
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      paper-studio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  paper-studio-data:
  paper-studio-workspace:
  paper-studio-assets:
  paper-studio-voiceover:
  caddy-data:
  caddy-config:
